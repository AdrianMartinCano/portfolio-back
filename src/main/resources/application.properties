spring.application.name=portfolio
server.port=${PORT:8080}

# SMTP (Plesk) — envío del formulario de contacto.
# El usuario debe ser el buzón completo (p. ej. hello@codeadrianmc.dev) y el
# remitente (CONTACTO_REMITENTE_EMAIL) debe coincidir con ese buzón para que
# SPF/DKIM queden alineados.
spring.mail.host=${MAIL_HOST:mail.codeadrianmc.dev}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
# Puerto 465 -> SSL directo (SMTPS). Para 587 sería starttls en vez de ssl.enable.
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
# Timeouts para no colgar la petición si el SMTP no responde.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

contacto.destino=${CONTACTO_DESTINO:}
contacto.remitente.email=${CONTACTO_REMITENTE_EMAIL:}
contacto.remitente.nombre=${CONTACTO_REMITENTE_NOMBRE:}
